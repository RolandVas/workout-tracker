<div class="create-form">
  <h2>Create New Workout Plan</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label>Plan Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <div formArrayName="days" class="days-section">
      <h3>Workout Days</h3>

      @for (day of form.controls.days.controls; let i = $index; track day) {
      <div class="day-form">
        <div [formGroupName]="i">
          <h3>Day {{ i + 1 }}</h3>
          <div class="day-header">
            <mat-form-field>
              <mat-label>Day Name</mat-label>
              <input matInput formControlName="name">
            </mat-form-field>
            <mat-form-field>
              <mat-label>e.g. Monday</mat-label>
              <input matInput formControlName="day">
            </mat-form-field>
            <button type="button" (click)="removeDay(i)" class="remove-day-btn">Remove Day</button>
          </div>

          <div formArrayName="exercises" class="exercises-section">
            <h4>Exercises</h4>
            @for (ex of day.controls.exercises.controls; let j = $index; track ex) {
            <div [formGroupName]="j" class="exercise-form">
              <mat-form-field>
                <mat-label>Exercise</mat-label>
                <input matInput formControlName="name">
              </mat-form-field>
              <mat-form-field>
                <mat-label>Sets</mat-label>
                <input matInput type="number" formControlName="sets">
              </mat-form-field>
              <mat-form-field>
                <mat-label>Reps</mat-label>
                <input matInput type="number" formControlName="reps">
              </mat-form-field>
              <mat-form-field>
                <mat-label>Weight</mat-label>
                <input matInput type="number" formControlName="weight">
              </mat-form-field>
              <mat-form-field>
                <mat-label>Rest Time</mat-label>
                <input matInput type="number" formControlName="restTime">
              </mat-form-field>
              <button type="button" class="remove-exercise-btn" (click)="removeExercise(i, j)">X</button>
            </div>
            }
            <button type="button" class="add-exercise-btn" (click)="addExercise(i)">+ Add Exercise</button>
          </div>
        </div>
      </div>
      }
      <button type="button" class="add-day-btn" (click)="addDay()">+ Add Day</button>
    </div>

    <div class="form-actions">
      <button type="submit" class="save-btn">Save Plan</button>
    </div>
  </form>
</div>
